name: marine-erp

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 3000
  DB_HOST: db
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:-drydock}
  DB_USER: ${DB_USER:-drydock_app}
  DB_PASSWORD: ${DB_PASSWORD:-drydock_password}
  JWT_SECRET: ${JWT_SECRET:-ganti-dengan-rahasia-acak-minimal-32-karakter}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-ganti-dengan-rahasia-acak-minimal-32-karakter}
  JWT_EXPIRES_IN: 900
  REFRESH_TOKEN_TTL_DAYS: 7
  BCRYPT_COST: 12
  UPLOAD_DIR: uploads
  MAX_UPLOAD_SIZE: 10485760
  LOG_LEVEL: info

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-drydock}
      MYSQL_USER: ${DB_USER:-drydock_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-drydock_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -u
        - root
        - -p${MYSQL_ROOT_PASSWORD:-rootpassword}
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    build: *backend-build
    command: ['node', 'src/database/MigrationRunner.js']
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  backend:
    build: *backend-build
    environment: *backend-env
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-5173}:80'
    restart: unless-stopped

  seed:
    build: *backend-build
    command: ['node', 'src/database/SeedRunner.js']
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ['tools']
    restart: 'no'

volumes:
  db_data:
  uploads_data:
